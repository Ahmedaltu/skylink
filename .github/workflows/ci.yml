# Host build + C unit tests, Python parser tests. No cross-compile yet.
name: CI

on: 
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # libzmq3-dev: CMakeLists.txt:16 does find_package(ZMQ REQUIRED) even
      # though the host build doesn't need it. Installed rather than fixed for now.
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libzmq3-dev

      - name: Configure and build
        run: cmake -S . -B build && cmake --build build -j

      # The binary exits non-zero because of one known failure, so we judge the
      # result from its output instead of its exit code.
      - name: Run unit tests
        run: |
          set +e
          build/tests/units2/unit_tests2 2>&1 | tee test-output.txt
          set -e
          KNOWN=both_hmac_and_crc  # CRC+HMAC defect, see TODO at src/skylink_rx.c:144
          # Runner colors output even when piped; strip ANSI codes before parsing.
          plain=$(sed 's/\x1b\[[0-9;]*m//g' test-output.txt)
          # No summary line means the runner crashed or aborted: fail.
          if ! grep -qE '^Tests: .* total' <<<"$plain"; then
            echo "::error::Test summary missing; unit_tests2 did not finish."
            exit 1
          fi
          failed=$(grep -oP '^\s*FAIL \K\S+' <<<"$plain" || true)
          if grep -qx "$KNOWN" <<<"$failed"; then
            echo "::warning::Known failure '$KNOWN' still failing (CRC+HMAC defect, src/skylink_rx.c:144). Ignored by CI."
          else
            echo "::notice::Known failure '$KNOWN' passed. Remove the exception from ci.yml."
          fi
          unexpected=$(grep -vx "$KNOWN" <<<"$failed" || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected test failures: $(tr '\n' ' ' <<<"$unexpected")"
            exit 1
          fi

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-output
          path: test-output.txt

  # Python frame parser tests. System python3 (3.12) in a venv, no setup-python.
  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7

      # Pinned to the versions the tests were analysed with.
      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install construct==2.10.70 blake3==1.0.11 pytest==9.1.1

      # Known failures make pytest exit non-zero; the gate step below judges
      # the result from the junit XML instead.
      - name: Run pytest
        run: PYTHONPATH=.:tests .venv/bin/pytest -p no:cacheprovider -v --junitxml=pytest-results.xml tests || true

      - name: Check results
        run: |
          python3 - <<'EOF'
          import os, sys
          import xml.etree.ElementTree as ET

          # Real defects: header layout differs from the C code, and the parser
          # slices an 8-byte auth tag where the real tag is 4 bytes.
          KNOWN = {"test_parse.py::test_parsing",
                   "test_parse.py::test_variable_identity_lengths",
                   "test_parse.py::test_parse_extensions"}
          # Fails ~1/3 of runs. corrupt() (tests/utils.py) flips 1-20 random bits
          # without a seed, so each run differs. When a flip lands in the header,
          # parsing raises StreamError before the HMAC check (~27%), or the
          # "authenticated" flag gets cleared and HMAC is skipped (~7%).
          FLAKY = {"test_construct.py::test_hmac"}

          # Missing XML or zero tests means pytest crashed or collected nothing.
          if not os.path.exists("pytest-results.xml"):
              print("::error::pytest-results.xml missing; pytest did not run.")
              sys.exit(1)
          cases = list(ET.parse("pytest-results.xml").iter("testcase"))
          if not cases:
              print("::error::pytest-results.xml has zero tests.")
              sys.exit(1)

          passed, known, flaky, unexpected, seen = [], [], [], [], set()
          for c in cases:
              tid = c.get("classname", "").split(".")[-1] + ".py::" + c.get("name", "")
              seen.add(tid)
              bad = c.find("failure") is not None or c.find("error") is not None
              if not bad:
                  if c.find("skipped") is None:
                      passed.append(tid)
                  if tid in KNOWN:
                      print(f"::notice::Known failure {tid} passed. Remove the exception from ci.yml.")
              elif tid in KNOWN:
                  known.append(tid)
                  print(f"::warning::Known failure {tid} still failing (parser header layout / 8-byte auth tag).")
              elif tid in FLAKY:
                  flaky.append(tid)
                  print(f"::warning::Flaky test {tid} failed (unseeded random bit flips).")
              else:
                  unexpected.append(tid)
                  print(f"::error::Unexpected failure: {tid}")

          # Warn if a listed test was renamed or deleted, so its exception isn't silently lost.
          for tid in sorted((KNOWN | FLAKY) - seen):
              print(f"::warning::Listed test {tid} not found in results. Update ci.yml.")

          print(f"Summary: {len(passed)} passed / {len(known)} known-failing / "
                f"{len(flaky)} flaky / {len(unexpected)} unexpected")
          sys.exit(1 if unexpected else 0)
          EOF

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results
          path: python/pytest-results.xml
